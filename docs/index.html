<title>ระบบบริหารจัดการ ฮั่นหลิน</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #7a0d24, #3d0611);
    font-family: 'Prompt', 'Sarabun', sans-serif;
    color: #ffffff;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; opacity: 0.85; margin: 0 0 16px; }
  a { color: #ffffff; text-decoration: underline; }
</style>
<script>
  window.location.replace("https://script.google.com/macros/s/AKfycbzy1Upa06upePp36zlXhsE3b26P4dTFWDBjDwngBsU83484vDi3QreRIjhfvzhR1lLo/exec");
</script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>โรงเรียนกวดวิชาโรจนบัณฑิต "ฮั่นหลิน"</h1>
    <p>กำลังนำท่านไปยังระบบบริหารจัดการเรียนพิเศษ...</p>
    <a href="https://script.google.com/macros/s/AKfycbzy1Upa06upePp36zlXhsE3b26P4dTFWDBjDwngBsU83484vDi3QreRIjhfvzhR1lLo/exec">คลิกที่นี่หากไม่ถูกนำไปโดยอัตโนมัติ</a>
  </div>
